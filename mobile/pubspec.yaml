name: openscore_mobile
description: OpenScore Finance — Application mobile emprunteur (Microfinance Mali)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & API
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Navigation
  go_router: ^14.6.2

  # Secure storage & preferences
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Fonts & UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # File / Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

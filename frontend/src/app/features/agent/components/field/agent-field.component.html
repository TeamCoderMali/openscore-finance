<div class="space-y-6 animate-slide-up">
  <div class="card p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-5 gap-3">
      <div>
        <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <app-svg-icon name="check-circle" [size]="16" class="text-blue-900 dark:text-blue-400"></app-svg-icon>
          <span>Enquête de Proximité & Certification Terrain (Agent CIF/IMF)</span>
        </h3>
        <p class="text-xs text-slate-500 font-mono">Collecte des garanties informelles, géolocalisation du commerce et réputation tontine</p>
      </div>

      <div class="flex items-center gap-2">
        <button (click)="captureGps()" class="btn-secondary text-xs py-1 px-2.5 cursor-pointer flex items-center gap-1.5" [disabled]="gpsCapturing()">
          <app-spinner *ngIf="gpsCapturing()" size="sm" [inline]="true"></app-spinner>
          <app-svg-icon *ngIf="!gpsCapturing()" name="shield" [size]="14"></app-svg-icon>
          <span>Capturer GPS</span>
        </button>
      </div>
    </div>

    <!-- Application Selector & GPS Tag -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs mb-4">
      <div>
        <label class="form-label text-xs">Dossier de Crédit Cible</label>
        <select
          [ngModel]="selectedAppId()"
          (ngModelChange)="selectedAppId.set(+$event)"
          class="form-select text-xs dark:bg-slate-950 dark:border-slate-700 dark:text-white"
        >
          <option *ngFor="let a of applications()" [value]="a.id">
            {{ a.reference }} — {{ a.applicant_name }} ({{ a.requested_amount.toLocaleString('fr-FR') }} FCFA)
          </option>
        </select>
      </div>

      <div>
        <label class="form-label text-xs">Coordonnées GPS Certifiées</label>
        <div class="form-input text-xs font-mono bg-slate-50 dark:bg-slate-950 dark:border-slate-700 text-slate-700 dark:text-slate-300">
          📍 {{ gpsCoordinates() }}
        </div>
      </div>
    </div>

    <!-- Survey Form Fields -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
      <div>
        <label class="form-label text-xs">Type de Sûreté / Caution Constatée</label>
        <select
          [ngModel]="fieldGuaranteeType()"
          (ngModelChange)="fieldGuaranteeType.set($event)"
          class="form-select text-xs dark:bg-slate-950 dark:border-slate-700 dark:text-white"
        >
          <option value="Caution solidaire de groupe (Tontine)">Caution solidaire de groupe (Tontine)</option>
          <option value="Nantissement de stock marchandise">Nantissement de stock marchandise</option>
          <option value="Gage matériel / véhicule / moto">Gage matériel / véhicule / moto</option>
          <option value="Gage bijoux / métaux précieux">Gage bijoux / métaux précieux</option>
          <option value="Caution morale d'un tiers notoire">Caution morale d'un tiers notoire</option>
        </select>
      </div>

      <div>
        <label class="form-label text-xs">Valeur Estimée de la Sûreté (FCFA)</label>
        <input
          type="number"
          step="50000"
          [ngModel]="fieldGuaranteeValue()"
          (ngModelChange)="fieldGuaranteeValue.set(+$event)"
          class="form-input text-xs font-mono dark:bg-slate-950 dark:border-slate-700 dark:text-white"
        />
      </div>

      <div>
        <label class="form-label text-xs">Avis Moralité & Réputation sur le Marché</label>
        <select
          [ngModel]="fieldMarketReputation()"
          (ngModelChange)="fieldMarketReputation.set($event)"
          class="form-select text-xs dark:bg-slate-950 dark:border-slate-700 dark:text-white"
        >
          <option value="Très favorable (Recommandé par le chef de marché)">Très favorable (Recommandé par le chef de marché)</option>
          <option value="Favorable (Commerçant régulier sans litige)">Favorable (Commerçant régulier sans litige)</option>
          <option value="Réservé (Activité récente, surveillance requise)">Réservé (Activité récente, surveillance requise)</option>
          <option value="Défavorable (Retards tontines ou litiges passés)">Défavorable (Retards tontines ou litiges passés)</option>
        </select>
      </div>

      <div>
        <label class="form-label text-xs">Flux de Trésorerie Journalier Constaté (FCFA/j)</label>
        <input
          type="number"
          step="5000"
          [ngModel]="fieldDailyCashFlow()"
          (ngModelChange)="fieldDailyCashFlow.set(+$event)"
          class="form-input text-xs font-mono dark:bg-slate-950 dark:border-slate-700 dark:text-white"
        />
      </div>
    </div>

    <div class="mt-4">
      <label class="form-label text-xs">Notes d'Observations Terrain de l'Agent</label>
      <textarea
        [ngModel]="fieldSurveyNotes()"
        (ngModelChange)="fieldSurveyNotes.set($event)"
        rows="3"
        class="form-input text-xs dark:bg-slate-950 dark:border-slate-700 dark:text-white"
        placeholder="Décrire l'emplacement du commerce, l'achalandage, l'état des stocks et les entretiens de voisinage..."
      ></textarea>
    </div>

    <div class="flex justify-end pt-4 border-t border-slate-200 dark:border-slate-800 mt-5">
      <button
        (click)="submitFieldSurvey()"
        class="btn-primary text-xs shadow-xs cursor-pointer"
        [disabled]="saving() || !selectedAppId()"
      >
        <app-spinner *ngIf="saving()" size="sm" [inline]="true" variant="white"></app-spinner>
        <app-svg-icon *ngIf="!saving()" name="check-circle" [size]="14"></app-svg-icon>
        <span>Certifier & Sauvegarder l'Enquête</span>
      </button>
    </div>
  </div>
</div>

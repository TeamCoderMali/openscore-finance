<div class="inline-flex items-center gap-2.5 select-none" [ngClass]="{'gap-3': size === 'lg', 'gap-2': size === 'sm'}">
  <!-- OSF Flat 2D Vector Emblem Icon (Responsive to Light / Dark Themes) -->
  <svg
    viewBox="0 0 36 36"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class="shrink-0 transition-transform duration-200 hover:scale-[1.05]"
    [ngClass]="{
      'w-7 h-7': size === 'sm',
      'w-9 h-9': size === 'md',
      'w-12 h-12': size === 'lg'
    }"
  >
    <!-- Outer Focus / Scoring Target Ring -->
    <circle
      cx="18"
      cy="18"
      r="16.5"
      class="stroke-slate-300 dark:stroke-blue-500/40"
      stroke-width="1.2"
    />
    <!-- Inner Badge Disc -->
    <circle
      cx="18"
      cy="18"
      r="13.5"
      class="fill-blue-50/80 dark:fill-blue-950/90 stroke-blue-600 dark:stroke-blue-400"
      stroke-width="1.8"
    />
    <!-- Scoring Approval Checkmark & Upward Trend Arrow -->
    <path
      d="M11 19.5L15.5 24L25 12"
      class="stroke-blue-700 dark:stroke-blue-400"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M20 12H25V17"
      class="stroke-blue-700 dark:stroke-blue-400"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>

  <!-- Text Branding -->
  <div *ngIf="variant !== 'icon'" class="flex flex-col">
    <div class="flex items-center gap-1.5 leading-none">
      <span
        class="font-bold tracking-tight text-slate-900 dark:text-white"
        [ngClass]="{
          'text-sm': size === 'sm',
          'text-base': size === 'md',
          'text-xl': size === 'lg'
        }"
      >
        OpenScore
      </span>
      <span
        class="font-bold tracking-tight text-blue-700 dark:text-blue-400"
        [ngClass]="{
          'text-sm': size === 'sm',
          'text-base': size === 'md',
          'text-xl': size === 'lg'
        }"
      >
        Finance
      </span>
      <!-- Monospace OSF Tag -->
      <span
        class="font-mono text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-blue-50 dark:bg-blue-950/60 text-blue-900 dark:text-blue-300 border border-blue-200 dark:border-blue-800 tracking-wider ml-0.5"
      >
        OSF
      </span>
    </div>

    <!-- Editorial Subtitle -->
    <div
      *ngIf="variant === 'full'"
      class="flex items-center gap-1 text-[9px] uppercase font-mono tracking-widest text-slate-400 mt-1 font-semibold leading-none"
    >
      <span>{{ subtitle }}</span>
    </div>
  </div>
</div>

<div class="voice-assistant-container">
  <!-- Main Floating Mic Button -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="toggleRecording()"
      class="relative flex items-center justify-center transition-all duration-300 shadow-md cursor-pointer rounded-full"
      [class.w-12]="compact"
      [class.h-12]="compact"
      [class.w-14]="!compact"
      [class.h-14]="!compact"
      [class.bg-rose-600]="isRecording()"
      [class.animate-pulse]="isRecording()"
      [class.ring-4]="isRecording()"
      [class.ring-rose-500/30]="isRecording()"
      [class.bg-blue-900]="!isRecording()"
      [class.hover:bg-blue-800]="!isRecording()"
      [class.hover:shadow-lg]="!isRecording()"
      [class.ring-4]="!isRecording()"
      [class.ring-blue-900/10]="!isRecording()"
      title="Assistant Vocal (Français / Bambara)"
    >
      <!-- Mic Icon -->
      <app-svg-icon name="mic" [size]="compact ? 20 : 24" class="text-white"></app-svg-icon>

      <!-- Recording Wave Rings -->
      <span *ngIf="isRecording()" class="absolute inset-0 rounded-full bg-rose-500 animate-ping opacity-25 pointer-events-none"></span>
    </button>

    <!-- Language & Status Indicator -->
    <div class="flex flex-col" *ngIf="!compact">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-semibold text-zinc-800">Assistant Vocal</span>
        <div class="flex items-center rounded bg-zinc-100 p-0.5 text-[10px] font-mono">
          <button
            type="button"
            (click)="setLanguage('fr')"
            class="px-1.5 py-0.5 rounded"
            [class.bg-white]="language() === 'fr'"
            [class.text-blue-900]="language() === 'fr'"
            [class.font-bold]="language() === 'fr'"
            [class.text-zinc-500]="language() !== 'fr'"
          >FR</button>
          <button
            type="button"
            (click)="setLanguage('bm')"
            class="px-1.5 py-0.5 rounded"
            [class.bg-white]="language() === 'bm'"
            [class.text-emerald-800]="language() === 'bm'"
            [class.font-bold]="language() === 'bm'"
            [class.text-zinc-500]="language() !== 'bm'"
          >BM</button>
        </div>
      </div>
      <p class="text-[11px] text-zinc-400 font-mono mt-0.5">
        <span *ngIf="!isRecording() && !isProcessing()">Français / Bamanankan</span>
        <span *ngIf="isRecording()" class="text-rose-600 font-semibold animate-pulse">Écoute en cours...</span>
        <span *ngIf="isProcessing()" class="text-blue-700 font-semibold">Analyse sémantique IA...</span>
      </p>
    </div>
  </div>

  <!-- Realtime Transcription Preview Bubble -->
  <div *ngIf="transcript()" class="mt-3 p-3 bg-zinc-50 border border-zinc-200 rounded-lg shadow-sm animate-fade-in text-xs">
    <div class="flex items-center justify-between text-[10px] font-mono text-zinc-400 uppercase tracking-wider mb-1">
      <span class="flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        Transcription vocale
      </span>
      <span>{{ language() === 'bm' ? 'Bambara' : 'Français' }}</span>
    </div>
    <p class="text-zinc-800 font-medium leading-relaxed italic">"{{ transcript() }}"</p>
  </div>

  <!-- Assistant Response Card -->
  <div *ngIf="response() && !isProcessing()" class="mt-3 p-3.5 bg-blue-50 border border-blue-200 rounded-lg animate-slide-up text-xs">
    <div class="flex items-center gap-1.5 text-blue-900 font-semibold mb-1">
      <app-svg-icon name="check-circle" [size]="14" class="text-blue-700"></app-svg-icon>
      <span>Réponse OpenScore Assist :</span>
    </div>
    <p class="text-blue-950 leading-relaxed">{{ response()!.response_text }}</p>

    <!-- Suggestions Chips -->
    <div *ngIf="response()!.suggestions.length > 0" class="mt-2.5 flex flex-wrap gap-1.5">
      <span class="text-[10px] text-blue-800 font-mono self-center">Suggestions :</span>
      <button
        *ngFor="let s of response()!.suggestions"
        type="button"
        (click)="transcript.set(s); finishRecording()"
        class="px-2 py-0.5 bg-white border border-blue-200 rounded-full text-[11px] text-blue-800 hover:bg-blue-100 transition-colors shadow-2xs"
      >
        {{ s }}
      </button>
    </div>
  </div>
</div>
